<body>
<div class="top">
  <div class="tool-row create-row"><span class="brand">✦ 白板モーション v4.2</span><button data-tool="select" class="active quick-select">↖ 選択</button><details class="tool-group create-group"><summary>✚ 作成</summary><div class="tool-group-menu"><button data-tool="pen">✎ 手書き</button><button data-tool="rect">□ 四角</button><button data-tool="ellipse">○ 円</button><button data-tool="line">／ 線</button><button data-tool="arrow">➜ 矢印</button><button data-tool="text">T 文字</button><button id="addImage">▧ 写真</button><button id="aiImageBtn">✨ AIイラスト</button></div></details><details class="tool-group edit-group"><summary>✎ 編集</summary><div class="tool-group-menu"><button id="copyBtn">⧉ コピー</button><button id="pasteBtn">▣ 貼付</button><button id="deleteBtn" disabled>⌫ 削除</button><button id="groupBtn">部品化</button></div></details></div>
  <div class="tool-row edit-row"><details class="tool-group design-group"><summary>✦ デザイン</summary><div id="themeMenu" class="tool-group-menu theme-menu"></div></details><details class="tool-group action-group"><summary>▶ 動作</summary><div class="tool-group-menu"><button id="linkBtn">↔ ページ移動</button><button id="runBtn">▶ 実行</button><button id="presentBtn">▣ プレゼン</button></div></details><details class="tool-group history-group"><summary>↶ 履歴</summary><div class="tool-group-menu"><button id="undoBtn" title="元に戻す">↶ 元に戻す</button><button id="redoBtn" title="やり直す">↷ やり直す</button><button id="resetBtn">操作リセット</button></div></details><details class="tool-group file-group"><summary>▣ ファイル</summary><div class="tool-group-menu"><button id="saveBtn">保存</button><button id="loadBtn">読込</button><button id="pngBtn">PNG</button><button id="exportPresentBtn">⬇ プレゼン書出</button></div></details><span id="autosaveStatus" class="autosave-status">自動保存準備中</span></div>
</div>
<input id="fileImage" type="file" accept="image/*"><input id="fileLoad" type="file" accept="application/json,.json">
<div class="app">
  <section class="panel pages"><h3>📒 ページ <button id="addPage" class="mini">＋</button></h3><div id="pageList" class="scroll"></div><div class="hint">ページは教材の場面です。複製して一部だけ変える使い方もできます。</div></section>
  <main class="canvas-wrap"><div class="canvas-box"><svg id="stage" viewBox="0 0 960 600" aria-label="白板"><defs><marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><g id="slideBackground"></g><g id="content"></g><g id="selectionLayer"></g></svg><div id="status" class="status">選択モード</div></div></main>
  <section class="panel layers"><h3>🎨 レイヤー <button id="addLayer" class="mini">＋</button></h3><div id="layerList" class="scroll"></div><div id="props" class="props"></div></section>
  <section class="timeline"><div class="timeline-head"><strong>🎬 このページの差分</strong><button id="captureBtn" class="mini">＋ 新しい状態を記録</button><button id="updateFrameBtn" class="mini">選択状態を上書き</button><button id="playBtn" class="mini">▶ 差分再生</button></div><div id="frames" class="frames"></div></section>
</div>
<div class="version-badge">最新版 v4.2</div>

<div id="toast" class="toast"></div>
<div id="aiModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle">
  <div class="modal-card"><div class="modal-head"><h2 id="aiModalTitle">✨ AIイラストを作る</h2><button id="aiClose" class="modal-close" aria-label="閉じる">×</button></div>
    <label style="display:grid;gap:6px;font-weight:700">描きたいイラスト<textarea id="aiPrompt" maxlength="800" placeholder="例：森の中で本を読む子ども。明るく親しみやすい教材イラスト"></textarea></label>
    <div class="modal-options"><label>絵柄 <select id="aiStyle"><option>教材イラスト</option><option>シンプルな線画</option><option>漫画</option><option>水彩画</option><option>写実的</option></select></label><label>形 <select id="aiRatio"><option value="1:1">正方形</option><option value="4:3">横長 4:3</option><option value="16:9">横長 16:9</option><option value="3:4">縦長 3:4</option></select></label></div>
    <div class="hint" style="padding:12px 0;line-height:1.7">① 指示文をコピー　② 下から画像生成サービスを選ぶ　③ 画像をダウンロード　④ 白板の「写真」から読み込んでください。</div>
    <div id="aiMessage" class="hint" style="min-height:30px"></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 14px"><button id="aiOpenGemini">◆ Gemini ↗</button><button id="aiOpenDesigner">▦ Microsoft Designer ↗</button><button id="aiOpenFirefly">✦ Adobe Firefly ↗</button><button id="aiOpenCanva">C Canva ↗</button></div>
    <div class="modal-actions"><button id="aiCancel">閉じる</button><button id="aiGenerate" class="primary">指示文をコピー</button></div>
  </div>
</div>
<div id="textModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
  <div class="modal-card"><div class="modal-head"><h2 id="textModalTitle">文字を入力</h2><button id="textClose" class="modal-close" aria-label="文字編集を閉じる">×</button></div>

function renderProps(){const box=$('#props');if(selected.length!==1){box.innerHTML='<div class="empty">部品を選ぶと設定が表示されます。</div>';return}const o=page().objects.find(x=>x.id===selected[0]);if(!o){box.innerHTML='';return}const colorLabel=o.type==='text'?'文字色':'線色',fillLabel=o.type==='text'?'背景色':'塗り',clearLabel=o.type==='text'?'背景透明':'透明塗り';box.innerHTML=`<strong>選択中：${labelType(o.type)}</strong><label>${colorLabel}<input id="pStroke" type="color" value="${safeColor(o.stroke,'#243041')}"></label><label>${fillLabel}<input id="pFill" type="color" value="${safeColor(o.fill,'#ffffff')}"></label><label>${clearLabel}<input id="pNoFill" type="checkbox" ${o.fill==='transparent'?'checked':''}></label><label>線の太さ<input id="pSw" type="range" min="1" max="24" value="${o.sw||4}"></label><label>透明度<input id="pOpacity" type="range" min="0" max="1" step=".05" value="${o.opacity??1}"></label><label>名前<input id="pName" value="${escapeHtml(o.name||labelType(o.type))}"></label><div class="row"><button id="frontBtn" class="mini">最前面</button><button id="backBtn" class="mini">最背面</button><button id="dupBtn" class="mini">複製</button><button id="delObj" class="mini danger">削除</button></div>`;
