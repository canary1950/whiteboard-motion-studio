<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17152a">
<title>白板モーション Mobile v1.0</title>
<style>
:root{--ink:#f8f7ff;--panel:#211d38;--accent:#7c6cff;--accent2:#55b8ff;--muted:#aaa5c4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11101d;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;border:0;touch-action:manipulation}button:disabled{opacity:.35}.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:radial-gradient(circle at 30% 0,#332b58,#11101d 58%)}header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#17152ae8;backdrop-filter:blur(14px);z-index:5}.brand{font-weight:900;font-size:15px;white-space:nowrap}.title{min-width:0;flex:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{width:42px;height:42px;border-radius:13px;background:#2d2849;font-size:20px}.stage-wrap{display:grid;place-items:center;min-height:0;padding:8px;position:relative}.stage{display:block;width:min(calc(100vw - 16px),calc((100vh - 142px)*1.6));height:min(calc(100vh - 142px),calc((100vw - 16px)/1.6));max-width:100%;background:#fff;border-radius:12px;box-shadow:0 18px 55px #0008;touch-action:pan-y}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:#17152add;color:#fff;font-size:11px;pointer-events:none;opacity:0;transition:.2s}.hint.show{opacity:1}.controls{display:grid;grid-template-columns:52px 1fr 68px 1fr 52px;align-items:center;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#17152af2;backdrop-filter:blur(14px)}.control{height:50px;border-radius:15px;background:#2d2849;font-weight:800}.control.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:20px}.counter{text-align:center;font-size:13px;font-weight:800}.welcome{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 25% 10%,#54458c,#17152a 55%)}.welcome.hide{display:none}.card{width:min(420px,100%);padding:26px 20px;border:1px solid #ffffff22;border-radius:25px;background:#211d38e8;box-shadow:0 24px 70px #0008;text-align:center}.logo{font-size:54px}.card h1{margin:8px 0;font-size:25px}.card p{margin:8px 0 22px;color:#c3bed8;line-height:1.7}.open{display:block;width:100%;padding:15px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900;font-size:17px}.resume{display:none;width:100%;margin-top:10px;padding:13px;border-radius:15px;background:#363052;font-weight:800}.resume.show{display:block}.note{margin-top:16px!important;font-size:12px;line-height:1.55!important}.error{margin-top:13px;color:#ff9cae;font-size:13px;min-height:20px}#file{display:none}.loading{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#11101ddd;font-weight:800}.loading.show{display:grid}@media(orientation:landscape){header{position:fixed;top:0;left:0;right:0;background:transparent;pointer-events:none}.brand,.title{opacity:0}.small{pointer-events:auto}.controls{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(480px,calc(100% - 16px));border-radius:20px;padding:6px}.stage{width:min(calc(100vw - 8px),calc((100vh - 8px)*1.6));height:min(calc(100vh - 8px),calc((100vw - 8px)/1.6))}.stage-wrap{padding:4px}}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand">✦ 白板 Mobile</div><div id="title" class="title">作品を開いてください</div><button id="openTop" class="small" aria-label="作品を開く">📂</button><button id="fullTop" class="small" aria-label="全画面">⛶</button></header>
  <main class="stage-wrap"><svg id="stage" class="stage" viewBox="0 0 960 600" aria-label="プレゼンテーション"><defs><marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243041"/></marker></defs><g id="background"></g><g id="content"></g></svg><div id="hint" class="hint"></div></main>
  <nav class="controls"><button id="prev" class="control" aria-label="前のページ">←</button><button id="play" class="control primary">▶ 差分</button><div id="counter" class="counter">0 / 0</div><button id="next" class="control primary" aria-label="次のページ">次へ</button><button id="full" class="control" aria-label="全画面">⛶</button></nav>
</div>
<section id="welcome" class="welcome"><div class="card"><div class="logo">🎬</div><h1>白板モーション Mobile</h1><p>閲覧・プレゼン専用版<br>パソコン版で保存した教材を開きます。</p><button id="open" class="open">📂 教材ファイルを開く</button><button id="resume" class="resume">前回の作品を開く</button><p class="note">対応ファイル：白板モーションで「保存」したJSON<br>作品はこのiPhone内だけに保存されます。</p><div id="error" class="error"></div></div></section>
<div id="loading" class="loading">作品を読み込んでいます…</div><input id="file" type="file" accept="application/json,.json">
<script>
(function(){'use strict';
var NS='http://www.w3.org/2000/svg',project=null,index=0,playing=false,token=0,touchStart=null;
function q(s){return document.querySelector(s)}function el(tag,a){var n=document.createElementNS(NS,tag),k;a=a||{};for(k in a)n.setAttribute(k,a[k]);return n}function copy(v){return JSON.parse(JSON.stringify(v))}function media(o,key){if(o[key])return o[key];var m=project&&project.media&&o.assetId&&project.media[o.assetId];return m&&m[key]||''}
function releaseVideos(){var vs=q('#content').querySelectorAll('video'),i;for(i=0;i<vs.length;i++)try{vs[i].pause();vs[i].removeAttribute('src');vs[i].load()}catch(e){}}
function theme(p){var bg=q('#background'),key=p.theme||'white',colors={white:'#fff',pastel:'#fff9fc',blue:'#eaf5ff',chalk:'#173d36',grid:'#fbfdff',dark:'#171827'},r=el('rect',{x:0,y:0,width:960,height:600,fill:colors[key]||'#fff'});bg.innerHTML='';bg.appendChild(r);if(key==='pastel'){bg.appendChild(el('circle',{cx:80,cy:70,r:180,fill:'#ffe2ef'}));bg.appendChild(el('circle',{cx:900,cy:520,r:230,fill:'#dcf4ff'}));bg.appendChild(el('path',{d:'M0 535 Q240 485 470 545 T960 520 V600 H0Z',fill:'#f1e9ff'}))}else if(key==='grid'){var x,y;for(x=0;x<=960;x+=30)bg.appendChild(el('line',{x1:x,y1:0,x2:x,y2:600,stroke:'#a9c9e5','stroke-opacity':'.38'}));for(y=0;y<=600;y+=30)bg.appendChild(el('line',{x1:0,y1:y,x2:960,y2:y,stroke:'#a9c9e5','stroke-opacity':'.38'}))}else if(key==='chalk'){bg.appendChild(el('rect',{x:18,y:18,width:924,height:564,rx:12,fill:'none',stroke:'#d9c597','stroke-width':3}))}}
function object(o,nested){var g=el('g',{'class':nested?'part-child':'obj','data-id':nested?'':o.id,transform:'translate('+o.x+' '+o.y+') rotate('+(o.rot||0)+' '+((o.w||0)/2)+' '+((o.h||0)/2)+')',opacity:o.opacity==null?1:o.opacity}),common={stroke:o.stroke||'#243041','stroke-width':o.sw||4,fill:o.fill==null?'transparent':o.fill,'stroke-linecap':'round','stroke-linejoin':'round'},e,d,v,i,children;
if(o.type==='rect')e=el('rect',merge({x:0,y:0,width:o.w,height:o.h,rx:o.rx||0},common));else if(o.type==='ellipse')e=el('ellipse',merge({cx:o.w/2,cy:o.h/2,rx:Math.abs(o.w/2),ry:Math.abs(o.h/2)},common));else if(o.type==='line'||o.type==='arrow')e=el('line',merge({x1:0,y1:0,x2:o.w,y2:o.h,fill:'none'},common,o.type==='arrow'?{'marker-end':'url(#arrowHead)'}:{}));else if(o.type==='pen')e=el(o.closed?'polygon':'polyline',merge({points:(o.points||[]).map(function(p){return p.join(',')}).join(' '),fill:o.closed?(o.fill||'transparent'):'none'},common));else if(o.type==='text'){e=el('foreignObject',{x:0,y:0,width:Math.max(30,o.w),height:Math.max(30,o.h)});d=document.createElement('div');d.style.cssText='width:100%;height:100%;font-family:'+(o.fontFamily||'sans-serif')+';font-size:'+(o.font||28)+'px;font-weight:'+(o.bold?'700':'400')+';font-style:'+(o.italic?'italic':'normal')+';text-decoration:'+(o.underline?'underline':'none')+';text-align:'+(o.align||'left')+';color:'+(o.stroke||'#243041')+';background:'+(o.fill==='transparent'?'transparent':o.fill||'transparent')+';padding:4px;white-space:pre-wrap;overflow:hidden;writing-mode:'+(o.vertical?'vertical-rl':'horizontal-tb');d.textContent=o.text||'';e.appendChild(d)}else if(o.type==='image')e=el('image',{x:0,y:0,width:o.w,height:o.h,href:o.src,preserveAspectRatio:'none'});else if(o.type==='video'){if(playing){e=el('image',{x:0,y:0,width:o.w,height:o.h,href:media(o,'poster'),preserveAspectRatio:'none'})}else{e=el('foreignObject',{x:0,y:0,width:Math.max(40,o.w),height:Math.max(30,o.h)});v=document.createElementNS('http://www.w3.org/1999/xhtml','video');v.setAttribute('src',media(o,'src'));v.setAttribute('controls','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.style.cssText='width:100%;height:100%;display:block;background:#111;object-fit:contain';if(o.loop)v.setAttribute('loop','');if(o.muted||o.autoplay)v.muted=true;if(o.autoplay){v.setAttribute('autoplay','');v.play().catch(function(){})}e.appendChild(v)}}else if(o.type==='group'){children=o.children||[];for(i=0;i<children.length;i++)g.appendChild(object(children[i],true))}if(e)g.appendChild(e);return g}
function merge(){var out={},i,k;for(i=0;i<arguments.length;i++)for(k in arguments[i])out[k]=arguments[i][k];return out}
function draw(objects){var p=project.pages[index],c=q('#content'),layers=p.layers||[],i,j,lg,list;releaseVideos();c.innerHTML='';theme(p);for(i=0;i<layers.length;i++){if(layers[i].visible===false)continue;lg=el('g',{'data-layer':layers[i].id});list=objects||[];for(j=0;j<list.length;j++)if(list[j].layerId===layers[i].id)lg.appendChild(object(list[j],false));c.appendChild(lg)}}
function update(){if(!project)return;var p=project.pages[index];q('#title').textContent=project.title||p.name||'白板モーション';q('#counter').textContent=(index+1)+' / '+project.pages.length;q('#prev').disabled=index===0;q('#next').disabled=index===project.pages.length-1;q('#play').disabled=!p.frames||p.frames.length<2;draw(p.objects||[])}
function interp(a,b,t){return a+(b-a)*t}function mix(A,B,t){var map={},ids={},out=[],i,id,a,b,o,k,keys=['x','y','w','h','rot','opacity'];for(i=0;i<A.length;i++){map[A[i].id]=A[i];ids[A[i].id]=1}for(i=0;i<B.length;i++)ids[B[i].id]=1;for(id in ids){a=map[id];b=null;for(i=0;i<B.length;i++)if(B[i].id===id){b=B[i];break}if(a&&b){o=copy(t<.5?a:b);for(i=0;i<keys.length;i++){k=keys[i];o[k]=interp(Number(a[k]==null?(k==='opacity'?1:0):a[k]),Number(b[k]==null?(k==='opacity'?1:0):b[k]),t)}out.push(o)}else if(a){o=copy(a);o.opacity=(a.opacity==null?1:a.opacity)*(1-t);out.push(o)}else if(b){o=copy(b);o.opacity=(b.opacity==null?1:b.opacity)*t;out.push(o)}}return out}
function playFrames(){if(!project||playing)return;var p=project.pages[index],frames=p.frames||[],mine,duration,i;if(frames.length<2){showHint('このページには差分がありません');return}playing=true;mine=++token;duration=Math.max(200,Math.min(3000,p.frameDuration||850));draw(frames[0].objects||[]);i=0;function nextFrame(){if(i>=frames.length-1||mine!==token){playing=false;if(mine===token)draw(frames[frames.length-1].objects||[]);return}var start=performance.now();function tick(now){if(mine!==token){playing=false;return}var t=Math.min(1,(now-start)/duration),ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;draw(mix(frames[i].objects||[],frames[i+1].objects||[],ease));if(t<1)requestAnimationFrame(tick);else{i++;nextFrame()}}requestAnimationFrame(tick)}nextFrame()}
function go(n){if(!project)return;token++;playing=false;index=Math.max(0,Math.min(n,project.pages.length-1));update()}
function action(id){var list=project.pages[index].objects||[],o=null,i,target;for(i=0;i<list.length;i++)if(list[i].id===id){o=list[i];break}if(!o||o.type==='video')return false;if(o.action&&o.action.type==='page'){for(i=0;i<project.pages.length;i++)if(project.pages[i].id===o.action.targetId){target=i;break}if(target!=null)go(target);return true}if(o.action&&o.action.type==='next'){go(index+1);return true}if(o.action&&o.action.type==='play'){playFrames();return true}return false}
function showHint(s){var h=q('#hint');h.textContent=s;h.classList.add('show');setTimeout(function(){h.classList.remove('show')},1600)}
function valid(p){return p&&Array.isArray(p.pages)&&p.pages.length>0}function openProject(p,save){if(!valid(p))throw new Error('形式が違います');project=p;index=0;playing=false;token++;q('#welcome').classList.add('hide');update();if(save)saveLast(p)}
function db(){return new Promise(function(resolve,reject){var r=indexedDB.open('WhiteboardMotionMobile',1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains('works'))r.result.createObjectStore('works')};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}
function saveLast(p){db().then(function(d){var tx=d.transaction('works','readwrite');tx.objectStore('works').put(JSON.stringify(p),'last')}).catch(function(){})}function getLast(){return db().then(function(d){return new Promise(function(resolve){var r=d.transaction('works').objectStore('works').get('last');r.onsuccess=function(){resolve(r.result||null)};r.onerror=function(){resolve(null)}})})}
function choose(){q('#file').click()}function loadFile(file){q('#loading').classList.add('show');var r=new FileReader;r.onload=function(){try{openProject(JSON.parse(r.result),true);q('#error').textContent=''}catch(e){q('#error').textContent='この教材ファイルは読み込めません。'}q('#loading').classList.remove('show')};r.onerror=function(){q('#loading').classList.remove('show');q('#error').textContent='ファイルを読み込めません。'};r.readAsText(file)}
q('#open').onclick=choose;q('#openTop').onclick=choose;q('#file').onchange=function(e){var f=e.target.files[0];e.target.value='';if(f)loadFile(f)};q('#resume').onclick=function(){getLast().then(function(s){if(s)try{openProject(JSON.parse(s),false)}catch(e){q('#error').textContent='前回の作品を開けません。'}})};q('#prev').onclick=function(){go(index-1)};q('#next').onclick=function(){go(index+1)};q('#play').onclick=playFrames;
function fullscreen(){var root=document.documentElement;if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();else if(root.requestFullscreen)root.requestFullscreen().catch(function(){});else showHint('Safariでは「ホーム画面に追加」すると全画面で使えます')}q('#full').onclick=fullscreen;q('#fullTop').onclick=fullscreen;
q('#stage').onclick=function(e){var n=e.target;while(n&&n!==q('#stage')&&!n.classList.contains('obj'))n=n.parentNode;if(n&&n!==q('#stage')&&action(n.getAttribute('data-id')))return;if(e.target.tagName.toLowerCase()!=='video')playFrames()};
q('#stage').addEventListener('touchstart',function(e){if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});q('#stage').addEventListener('touchend',function(e){if(!touchStart||!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();go(index+(dx<0?1:-1))}},{passive:false});
getLast().then(function(s){if(s)q('#resume').classList.add('show')}).catch(function(){});
})();
</script>
</body>
</html>
